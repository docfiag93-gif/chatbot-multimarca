<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas · Chatbot multimarca</title>
<style>
  :root { --ok:#16a34a; --mal:#dc2626; --tinta:#0f172a; --suave:#64748b; --linea:#e2e8f0; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#f8fafc; color:var(--tinta); line-height:1.55; }
  .hoja { max-width:900px; margin:0 auto; padding:32px 20px 80px; }

  .resumen { padding:14px 18px; border-radius:10px; font-weight:600; margin-bottom:22px; }

              color:var(--suave); margin:0; padding:12px 18px; background:#f8fafc;

<body>
<div class="hoja">
  <h1>Pruebas del chatbot multimarca</h1>
  <p class="sub">Corren en el navegador con <code>fetch</code> simulado: no se hace
  ninguna llamada real ni se gasta cuota de ningún proveedor.</p>
  <div id="resumen" class="resumen">Corriendo…</div>
  <div id="salida"></div>
</div>

<script type="module">
import {
  planDeProveedores, preguntar, extraerJSON, limpiar,
  _limpiarCacheModelos, ORDEN_POR_OMISION,
} from '../servidor/nucleo/proveedores.mjs';
import { revisarEntorno, explicarFallo, probarBase } from '../servidor/nucleo/diagnostico.mjs';
import { respuestaInmediata, decidirSinIA } from '../servidor/nucleo/cerebro.mjs';
import { huecosLibres, tresOpciones, cualEligio } from '../servidor/nucleo/agenda.mjs';
import { TOPES, topeDe, estadoDeCuota, respuestaPorTope } from '../servidor/nucleo/cuota.mjs';
import { temaSugerido } from '../publico/cerebro/temas.mjs';
import { cifrar, descifrar, generarLlaveMaestra } from '../publico/cerebro/cifrado.mjs';
import { normalizarPerfil, perfilPublico, revisarPerfil, aSlug, NEUTRO } from '../publico/cerebro/perfil.mjs';
import { CATEGORIAS_SUGERIDAS } from '../publico/cerebro/catalogos-ui.mjs';
import { POLITICAS, interceptar, aportesDePoliticas, catalogoDePoliticas } from '../servidor/nucleo/politicas.mjs';
import { ACCIONES } from '../servidor/nucleo/acciones.mjs';
import { accionesDisponibles, accionPermitida, fragmentoDeAcciones } from '../servidor/nucleo/acciones.mjs';
import { construirPrompt, accionValida } from '../servidor/nucleo/cerebro.mjs';
import { SEMILLAS } from '../publico/cerebro/semillas.mjs';
import { POLITICAS_UI, ACCIONES_UI } from '../publico/cerebro/catalogos-ui.mjs';
import { obtenerMarca } from '../servidor/nucleo/marcas.mjs';
import { revisarAnclaje, afirmacionesDe, corpusDe, revisarRedaccion, pulir,
         recortarAFrases, unaSolaPregunta,
         limpiarMuletillas, respuestaSinDato } from '../servidor/nucleo/anclaje.mjs';
import { firmar, verificar, enviarEvento, generarSecreto, catalogoDeEventos,
         VENTANA_SEGUNDOS } from '../servidor/nucleo/enlaces.mjs';

/* ── mini marco de pruebas ─────────────────────────────────────────── */
const suites = [];
let actual = null;
function suite(nombre, fn) { actual = { nombre, casos: [] }; suites.push(actual); return fn(); }
function ok(nombre, condicion, porque = '') {
  actual.casos.push({ nombre, pasa: !!condicion, porque: condicion ? '' : porque });
}
async function lanza(fn) { try { await fn(); return null; } catch (e) { return e; } }

/* ── fetch simulado ────────────────────────────────────────────────── */
// Cada prueba describe qué debe contestar cada URL. Respeta la señal de
// aborto para poder probar el tiempo límite de verdad.
function simularFetch(guion) {
  const llamadas = [];
  globalThis.fetch = (url, opciones = {}) => {
    const u = String(url);
    llamadas.push({ url: u, headers: opciones.headers || {} });
    const paso = guion.find(g => g.coincide(u, llamadas.length));
    if (!paso) return Promise.resolve(new Response('{}', { status: 404 }));

    if (paso.colgar) {
      return new Promise((_, rechazar) => {
        opciones.signal?.addEventListener('abort', () => {
          const err = new Error('abortado'); err.name = 'AbortError'; rechazar(err);
        });
      });
    }
    return Promise.resolve(new Response(
      typeof paso.cuerpo === 'string' ? paso.cuerpo : JSON.stringify(paso.cuerpo ?? {}),
      { status: paso.estado ?? 200, headers: { 'content-type': 'application/json' } }));
  };
  return llamadas;
}
const fetchReal = globalThis.fetch;
function restaurarFetch() { globalThis.fetch = fetchReal; }

// Respuestas de cada proveedor, en su formato real.
const LISTA_GEMINI = { models: [{ name: 'models/gemini-2.5-flash', supportedGenerationMethods: ['generateContent'] }] };
const LISTA_GROQ   = { data: [{ id: 'llama-3.1-8b-instant' }] };
const RESP_GEMINI  = t => ({ candidates: [{ content: { parts: [{ text: JSON.stringify(t) }] } }] });
const RESP_GROQ    = t => ({ choices: [{ message: { content: JSON.stringify(t) } }] });
const CUERPO = { texto: 'hola', sugerencias: [], accion: 'ninguna' };

const entornoDe = obj => n => obj[n];

/* ══════════════════════════════════════════════════════════════════════
   1 · ENCAMINAMIENTO
   ══════════════════════════════════════════════════════════════════════ */
suite('Encaminamiento de proveedores', () => {
  const env2 = entornoDe({ GEMINI_API_KEY: 'g1', GROQ_API_KEY: 'q1' });

  const porOmision = planDeProveedores({ marca: {}, leerEntorno: env2 });
  ok('sin configuración usa el orden por omisión',
     porOmision.map(p => p.nombre).join(',') === ORDEN_POR_OMISION,
     'obtuvo ' + porOmision.map(p => p.nombre).join(','));

  const conEnv = planDeProveedores({
    marca: {}, leerEntorno: entornoDe({ BOT_ORDEN: 'groq,gemini', GEMINI_API_KEY: 'g1', GROQ_API_KEY: 'q1' }) });
  ok('BOT_ORDEN cambia el orden', conEnv.map(p => p.nombre).join(',') === 'groq,gemini');

  const porMarca = planDeProveedores({
    marca: { proveedores: ['groq'] },
    leerEntorno: entornoDe({ BOT_ORDEN: 'gemini', GEMINI_API_KEY: 'g1', GROQ_API_KEY: 'q1' }) });
  ok('la marca gana sobre BOT_ORDEN',
     porMarca.length === 1 && porMarca[0].nombre === 'groq');

  const sinLlave = planDeProveedores({
    marca: {}, leerEntorno: entornoDe({ BOT_ORDEN: 'gemini,groq', GROQ_API_KEY: 'q1' }) });
  ok('se salta el proveedor sin llave',
     sinLlave.length === 1 && sinLlave[0].nombre === 'groq');

  const repetido = planDeProveedores({
    marca: { proveedores: ['groq', 'groq', 'gemini'] },
    leerEntorno: env2 });
  ok('no repite proveedores', repetido.map(p => p.nombre).join(',') === 'groq,gemini');

  const inventado = planDeProveedores({
    marca: { proveedores: ['inventado', 'groq'] }, leerEntorno: env2 });
  ok('ignora nombres desconocidos', inventado.map(p => p.nombre).join(',') === 'groq');

  const vacio = planDeProveedores({ marca: {}, leerEntorno: entornoDe({}) });
  ok('sin ninguna llave el plan queda vacío', vacio.length === 0);
});

/* ══════════════════════════════════════════════════════════════════════
   2 · LLAVES POR MARCA  (aislamiento entre inquilinos)
   ══════════════════════════════════════════════════════════════════════ */
suite('Llaves por marca · aislamiento', () => {
  const env2 = entornoDe({ GEMINI_API_KEY: 'PLATAFORMA', GROQ_API_KEY: 'PLATAFORMA_Q' });

  const conPropia = planDeProveedores({
    marca: { llaves: { gemini: 'DE_LA_MARCA' } }, leerEntorno: env2 });
  const g = conPropia.find(p => p.nombre === 'gemini');
  ok('la llave de la marca gana sobre la de la plataforma', g.key === 'DE_LA_MARCA');
  ok('se reporta el origen de la llave', g.origen === 'marca');

  const q = conPropia.find(p => p.nombre === 'groq');
  ok('sin llave propia cae a la de la plataforma', q.key === 'PLATAFORMA_Q' && q.origen === 'plataforma');

  // Dos marcas distintas, mismo entorno: ninguna debe ver la llave de la otra.
  const marcaA = planDeProveedores({ marca: { llaves: { gemini: 'LLAVE_A' } }, leerEntorno: env2 });
  const marcaB = planDeProveedores({ marca: { llaves: { gemini: 'LLAVE_B' } }, leerEntorno: env2 });
  ok('la marca A no recibe la llave de B',
     marcaA.find(p => p.nombre === 'gemini').key === 'LLAVE_A');
  ok('la marca B no recibe la llave de A',
     marcaB.find(p => p.nombre === 'gemini').key === 'LLAVE_B');

  const soloEnv = planDeProveedores({ marca: {}, leerEntorno: env2 });
  ok('una marca sin llaves propias no hereda las de otra marca',
     soloEnv.every(p => p.origen === 'plataforma'));
});

/* ══════════════════════════════════════════════════════════════════════
   3 · RESPALDO Y REINTENTO
   ══════════════════════════════════════════════════════════════════════ */
await suite('Respaldo y reintento', async () => {
  const env2 = entornoDe({ BOT_ORDEN: 'gemini,groq', GEMINI_API_KEY: 'g1', GROQ_API_KEY: 'q1' });

  // Gemini caído (500 siempre) → debe contestar Groq
  _limpiarCacheModelos();
  simularFetch([
    { coincide: u => u.includes('generativelanguage'), estado: 500, cuerpo: 'boom' },
    { coincide: u => u.includes('groq.com/openai/v1/models'), cuerpo: LISTA_GROQ },
    { coincide: u => u.includes('groq.com'), cuerpo: RESP_GROQ(CUERPO) },
  ]);
  const r1 = await preguntar({ prompt: 'x', leerEntorno: env2, reintentos: 0 });
  ok('si el primero falla, contesta el segundo', r1.via === 'groq');
  ok('el fallo del primero queda registrado', r1.intentos.length >= 1);

  // Reintento: primer intento 503, segundo bien
  _limpiarCacheModelos();
  let n = 0;
  globalThis.fetch = (url) => {
    const u = String(url);
    if (u.includes('groq.com/openai/v1/models')) return Promise.resolve(new Response(JSON.stringify(LISTA_GROQ)));
    if (u.includes('groq.com')) {
      n++;
      if (n === 1) return Promise.resolve(new Response('caido', { status: 503 }));
      return Promise.resolve(new Response(JSON.stringify(RESP_GROQ(CUERPO))));
    }
    return Promise.resolve(new Response('{}', { status: 404 }));
  };
  const r2 = await preguntar({ prompt: 'x', leerEntorno: entornoDe({ BOT_ORDEN: 'groq', GROQ_API_KEY: 'q1' }), reintentos: 1 });
  ok('un 503 pasajero se reintenta y acierta', r2.via === 'groq' && n === 2);

  // 401 NO se reintenta: es configuración, no un pico
  _limpiarCacheModelos();
  let m = 0;
  globalThis.fetch = (url) => {
    const u = String(url);
    if (u.includes('groq.com/openai/v1/models')) return Promise.resolve(new Response(JSON.stringify(LISTA_GROQ)));
    if (u.includes('groq.com')) { m++; return Promise.resolve(new Response('no autorizado', { status: 401 })); }
    return Promise.resolve(new Response('{}', { status: 404 }));
  };
  const e401 = await lanza(() => preguntar({ prompt: 'x', leerEntorno: entornoDe({ BOT_ORDEN: 'groq', GROQ_API_KEY: 'malaq' }), reintentos: 2 }));
  ok('un 401 no se reintenta', m === 1, 'se llamó ' + m + ' veces');
  ok('un 401 agota la cadena', e401?.codigo === 'TODOS_FALLARON');

  restaurarFetch();
});

/* ══════════════════════════════════════════════════════════════════════
   4 · TIEMPO LÍMITE
   ══════════════════════════════════════════════════════════════════════ */
await suite('Tiempo límite', async () => {
  _limpiarCacheModelos();
  simularFetch([
    { coincide: u => u.includes('generativelanguage'), colgar: true },
    { coincide: u => u.includes('groq.com/openai/v1/models'), cuerpo: LISTA_GROQ },
    { coincide: u => u.includes('groq.com'), cuerpo: RESP_GROQ(CUERPO) },
  ]);
  const t0 = Date.now();
  const r = await preguntar({
    prompt: 'x',
    leerEntorno: entornoDe({ BOT_ORDEN: 'gemini,groq', GEMINI_API_KEY: 'g1', GROQ_API_KEY: 'q1' }),
    msLimite: 300, reintentos: 0,
  });
  const ms = Date.now() - t0;
  ok('un proveedor colgado no bloquea: pasa al siguiente', r.via === 'groq');
  ok('el corte respeta el límite configurado', ms < 2500, 'tardó ' + ms + ' ms');
  ok('el vencimiento se registra como 408', r.intentos.some(i => i.estado === 408));
  restaurarFetch();
});

/* ══════════════════════════════════════════════════════════════════════
   5 · SIN LLAVES  ·  ERRORES SEGUROS
   ══════════════════════════════════════════════════════════════════════ */
await suite('Sin llaves y errores seguros', async () => {
  const e = await lanza(() => preguntar({ prompt: 'x', leerEntorno: entornoDe({}) }));
  ok('sin ninguna llave devuelve SIN_PROVEEDORES', e?.codigo === 'SIN_PROVEEDORES');

  const f = explicarFallo(e, { hayContacto: true });
  ok('el mensaje público NO menciona llaves ni variables',
     !/api|key|llave|variable|token|configur/i.test(f.publico), f.publico);
  ok('el mensaje público sí dice qué hacer', /escríbenos|int[eé]nt/i.test(f.publico));
  ok('el mensaje de administrador sí es específico', /llave/i.test(f.admin));
  ok('trae instrucción de arreglo', /GEMINI_API_KEY|GROQ_API_KEY/.test(f.arreglo));

  // Ningún valor secreto puede salir en un texto de error
  ok('limpiar() borra una llave de Google', limpiar('fallo key=AIzaSyABCDEFG12345 y más') === 'fallo key=*** y más');
  ok('limpiar() borra un Bearer', !limpiar('Authorization: Bearer gsk_abcdefghijklmno').includes('gsk_abcdef'));
  ok('limpiar() borra una llave sk-', !limpiar('usé sk-proj-abcdefghijklmnop').includes('abcdefghij'));

  // Un error de proveedor con la llave dentro llega ya limpio
  _limpiarCacheModelos();
  simularFetch([
    { coincide: u => u.includes('generativelanguage'), estado: 400,
      cuerpo: 'error en https://x/models?key=AIzaSyTOPSECRET123' },
  ]);
  const e2 = await lanza(() => preguntar({
    prompt: 'x', leerEntorno: entornoDe({ BOT_ORDEN: 'gemini', GEMINI_API_KEY: 'AIzaSyTOPSECRET123' }), reintentos: 0 }));
  const todo = JSON.stringify(e2?.intentos || []);
  ok('la llave no aparece en el detalle de los intentos', !todo.includes('TOPSECRET'), todo.slice(0, 120));
  restaurarFetch();
});

/* ══════════════════════════════════════════════════════════════════════
   6 · DIAGNÓSTICO DEL ENTORNO
   ══════════════════════════════════════════════════════════════════════ */
suite('Diagnóstico del entorno', () => {
  const vacio = revisarEntorno(entornoDe({}));
  ok('sin nada, no está listo', vacio.listo === false);
  ok('detecta que no hay proveedor', vacio.problemas.some(p => p.clave === 'sin_proveedor'));
  ok('el diagnóstico no contiene valores, solo booleanos',
     Object.values(vacio.proveedores).every(v => typeof v === 'boolean'));

  const conGemini = revisarEntorno(entornoDe({ GEMINI_API_KEY: 'g' }));
  ok('con un proveedor ya está listo', conGemini.listo === true);
  ok('sigue avisando de lo que falta', conGemini.problemas.some(p => p.gravedad === 'aviso'));

  const baseSinCifrado = revisarEntorno(entornoDe({
    GEMINI_API_KEY: 'g', SUPABASE_URL: 'u', SUPABASE_SERVICE_KEY: 'k' }));
  ok('base sin cifrado es crítico', baseSinCifrado.problemas.some(
     p => p.clave === 'base_sin_cifrado' && p.gravedad === 'critico'));
  ok('y por eso no está listo', baseSinCifrado.listo === false);

  const serializado = JSON.stringify(revisarEntorno(entornoDe({
    GEMINI_API_KEY: 'SECRETO_GEMINI', SUPABASE_SERVICE_KEY: 'SECRETO_SB' })));
  ok('el diagnóstico serializado no filtra ningún valor',
     !serializado.includes('SECRETO_GEMINI') && !serializado.includes('SECRETO_SB'));
});

/* ══════════════════════════════════════════════════════════════════════
   7 · DEGRADACIÓN
   ══════════════════════════════════════════════════════════════════════ */
suite('Degradación digna', () => {
  const cuota = explicarFallo({ codigo: 'TODOS_FALLARON', intentos: [{ estado: 429 }] }, { hayContacto: true });
  ok('cuota agotada: el admin lo sabe', /cuota/i.test(cuota.admin));
  ok('cuota agotada: el visitante recibe una salida', /escríbenos/i.test(cuota.publico));

  const lento = explicarFallo({ codigo: 'TODOS_FALLARON', intentos: [{ estado: 408 }] }, {});
  ok('vencimiento: se explica como pasajero', /tiempo|contestaron/i.test(lento.admin));
  ok('sin contacto, invita a reintentar', /int[eé]nt/i.test(lento.publico));

  const malaLlave = explicarFallo({ codigo: 'TODOS_FALLARON', intentos: [{ estado: 401 }] }, {});
  ok('llave rechazada: se distingue de la cuota', /rechaz|autoriz/i.test(malaLlave.admin));

  ok('nunca se filtra el detalle técnico al público',
     [cuota, lento, malaLlave].every(f => !/\b(429|408|401|gemini|groq)\b/i.test(f.publico)));
});

/* ══════════════════════════════════════════════════════════════════════
   8 · JSON TOLERANTE
   ══════════════════════════════════════════════════════════════════════ */
suite('Lectura de la respuesta', () => {
  ok('JSON limpio', extraerJSON('{"a":1}').a === 1);
  ok('JSON envuelto en ```json', extraerJSON('```json\n{"a":2}\n```').a === 2);
  ok('JSON envuelto en ``` a secas', extraerJSON('```\n{"a":3}\n```').a === 3);
  ok('JSON con texto alrededor', extraerJSON('claro: {"a":4} listo').a === 4);
  let fallo = false;
  try { extraerJSON('no hay json aquí'); } catch { fallo = true; }
  ok('texto sin JSON lanza error claro', fallo);
});

/* ══════════════════════════════════════════════════════════════════════
   9 · BANDERAS ROJAS  (no deben depender del proveedor)
   ══════════════════════════════════════════════════════════════════════ */
suite('Banderas rojas', () => {
  // CAMBIO DE CONTRATO: antes bastaba con marcar el negocio como 'clinico'.
  // Ahora la política se ENCIENDE por nombre. Un negocio de salud que solo
  // agenda citas puede no quererla, y ninguno la hereda por su rubro.
  const conPolitica = { politicas: ['urgencias-clinicas'] };
  const sinPolitica = { politicas: [] };
  const rubroSaludSinPolitica = { categoria: 'Salud y bienestar', politicas: [] };

  ok('dolor de pecho dispara con la política encendida', !!respuestaInmediata(conPolitica, 'me duele el pecho'));
  ok('no puedo respirar dispara', !!respuestaInmediata(conPolitica, 'no puedo respirar'));
  ok('sin política, la misma frase NO dispara', respuestaInmediata(sinPolitica, 'me duele el pecho') === null);
  ok('la categoría de salud por sí sola NO enciende nada',
     respuestaInmediata(rubroSaludSinPolitica, 'me duele el pecho') === null);
  ok('una consulta normal no dispara', respuestaInmediata(conPolitica, 'cuánto cuesta la consulta') === null);

  const r = respuestaInmediata(conPolitica, 'me duele el pecho');
  ok('la respuesta de urgencia no pasa por ningún proveedor', r.via === 'politica:urgencias-clinicas');
  ok('la respuesta de urgencia manda al 911', /911/.test(r.texto));
  ok('la respuesta dice qué política la produjo', r.politica === 'urgencias-clinicas');
});

/* ══════════════════════════════════════════════════════════════════════
   10 · CIFRADO POR MARCA
   ══════════════════════════════════════════════════════════════════════ */
await suite('Cifrado por marca', async () => {
  const maestra = generarLlaveMaestra();
  const A = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
  const B = 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb';
  const dato = { nombre: 'María', telefono: '9611234567' };

  const c = await cifrar(maestra, A, dato);
  ok('ida y vuelta', JSON.stringify(await descifrar(maestra, A, c)) === JSON.stringify(dato));
  ok('el cifrado no filtra el contenido', !c.includes('María') && !c.includes('9611234567'));
  ok('mismo dato, cifrado distinto', c !== await cifrar(maestra, A, dato));
  ok('la marca B no puede abrir lo de A', !!(await lanza(() => descifrar(maestra, B, c))));
  ok('otra llave maestra no abre', !!(await lanza(() => descifrar(generarLlaveMaestra(), A, c))));
});


/* ══════════════════════════════════════════════════════════════════════
   11 · ALTA DE UN NEGOCIO CUALQUIERA
   ══════════════════════════════════════════════════════════════════════ */
suite('Alta de un negocio cualquiera', () => {
  // Rubros que NO existían en el sistema anterior. Ninguno debe requerir
  // cambio de código.
  const rubros = [
    { nombre: 'Taller Mecánico El Piñón', categoria: 'Taller y reparación' },
    { nombre: 'Inmobiliaria Sur',         categoria: 'Inmobiliaria' },
    { nombre: 'Academia de Inglés',       categoria: 'Educación y formación' },
    { nombre: 'Despacho Contable RM',     categoria: 'Servicios profesionales' },
    { nombre: 'Refaccionaria Don Beto',   categoria: 'Otro' },
    { nombre: 'Criadero de Axolotes',     categoria: 'lo que se me ocurra' },
  ];

  rubros.forEach(r => {
    const p = normalizarPerfil(r);
    ok(`se puede dar de alta: ${r.nombre}`, p.nombre === r.nombre && p.categoria === r.categoria);
  });

  ok('la categoría acepta texto totalmente libre',

await suite('El núcleo no sabe de rubros', async () => {
  // Se leen los archivos del núcleo y se busca vocabulario sectorial. Las
  // semillas, seguridad y políticas quedan fuera a propósito: ahí SÍ debe
  // haber vocabulario, son ejemplos y módulos opt-in.
  const NUCLEO = ['perfil.mjs', 'acciones.mjs', 'cerebro.mjs', 'datos.mjs',
                  'proveedores.mjs', 'diagnostico.mjs', 'entorno.mjs'];
  const rutaDe = a => (a === 'perfil.mjs' ? '../publico/cerebro/' : '../servidor/nucleo/') + a + '?v=' + Date.now();
  const PROHIBIDO = /consultorio|paciente|síntoma|sintoma|receta|café|barista|tueste|inmobiliaria|taller mec/i;

  for (const archivo of NUCLEO) {
    const src = await (await fetch(rutaDe(archivo))).text();
    // Se ignoran los comentarios que EXPLICAN por qué ya no hay rubros.
    const codigo = src.split('\n')
      .filter(l => !/^\s*(\/\/|\*|\/\*)/.test(l))
      .join('\n');
    const hit = codigo.match(PROHIBIDO);
    ok(`${archivo} no tiene vocabulario de ningún rubro`, !hit, hit ? 'encontró: ' + hit[0] : '');
  }

  const wid = await (await fetch('../publico/widget.js?v=' + Date.now())).text();
  const codigoWidget = wid.split('\n').filter(l => !/^\s*(\/\/|\*)/.test(l)).join('\n');
  ok('el widget no trae textos de ningún rubro', !PROHIBIDO.test(codigoWidget));
});

   ══════════════════════════════════════════════════════════════════════ */
await suite('Enlaces salientes · firma', async () => {
  const secreto = generarSecreto();
  const cuerpo = JSON.stringify({ evento:'contacto.nuevo', datos:{ nombre:'Ana' } });
  const momento = Math.floor(Date.now()/1000);

  ok('el secreto son 32 bytes en hex', secreto.length === 64);
  ok('dos secretos nunca coinciden', generarSecreto() !== generarSecreto());

  const f = await firmar(secreto, cuerpo, momento);
  ok('la firma es determinista', f === await firmar(secreto, cuerpo, momento));
  ok('la firma no contiene el secreto', !f.includes(secreto.slice(0,16)));

  ok('una firma válida se acepta', (await verificar(secreto, cuerpo, momento, f)).valida);
  ok('otro secreto NO valida',
     !(await verificar(generarSecreto(), cuerpo, momento, f)).valida);
  ok('un cuerpo alterado NO valida',
     !(await verificar(secreto, cuerpo.replace('Ana','Beto'), momento, f)).valida);

  // El momento va DENTRO de lo firmado: cambiarlo invalida la firma.
  ok('cambiar la hora invalida la firma',
     !(await verificar(secreto, cuerpo, momento + 60, f)).valida);

  // Reenvío tardío: aunque la firma sea correcta, fuera de ventana se rechaza.
  const viejo = await verificar(secreto, cuerpo, momento, f,
                                (momento + VENTANA_SEGUNDOS + 60) * 1000);
  ok('un envío viejo se rechaza aunque la firma sea buena', !viejo.valida);
  ok('y dice por qué', /ventana/i.test(viejo.motivo));

  ok('una firma de otro largo se rechaza sin comparar',
     !(await verificar(secreto, cuerpo, momento, 'corta')).valida);
});

/* ══════════════════════════════════════════════════════════════════════
   20 · ENLACES SALIENTES · envío
   ══════════════════════════════════════════════════════════════════════ */
await suite('Enlaces salientes · envío', async () => {
  const enlace = { url:'https://sistema-del-cliente.test/hook', secreto: generarSecreto() };
  const real = globalThis.fetch;

  // sin enlace configurado no se intenta nada
  const sin = await enviarEvento({ enlace:null, evento:'contacto.nuevo', datos:{} });
  ok('sin enlace configurado no truena', sin.ok === false && /sin enlace/.test(sin.motivo));

  // envío correcto y firmado
  let recibido = null;
  globalThis.fetch = (u, o) => { recibido = { u:String(u), o }; return Promise.resolve(new Response('ok',{status:200})); };
  const r = await enviarEvento({ enlace, evento:'contacto.nuevo', empresaId:'e1',
                                 datos:{ nombre:'Ana', telefono:'961' } });
  ok('el envío correcto se reporta ok', r.ok === true);
  ok('llega firmado', !!recibido.o.headers['x-chatbot-firma']);
  ok('la firma del envío verifica del otro lado',
     (await verificar(enlace.secreto, recibido.o.body,
        recibido.o.headers['x-chatbot-momento'], recibido.o.headers['x-chatbot-firma'])).valida);
  ok('el secreto NO viaja en el mensaje',
     !recibido.o.body.includes(enlace.secreto) &&
     !JSON.stringify(recibido.o.headers).includes(enlace.secreto));
  ok('el cuerpo lleva el evento y la empresa',
     JSON.parse(recibido.o.body).evento === 'contacto.nuevo' &&
     JSON.parse(recibido.o.body).empresa === 'e1');

  // suscripción por evento
  const filtrado = await enviarEvento({
    enlace: { ...enlace, eventos:['cita.solicitada'] }, evento:'contacto.nuevo', datos:{} });
  ok('un evento no suscrito no se manda', filtrado.ok === false && /no suscrito/.test(filtrado.motivo));

  // 4xx: es del cliente, no se reintenta
  let n = 0;
  globalThis.fetch = () => { n++; return Promise.resolve(new Response('mal',{status:400})); };
  const cuatro = await enviarEvento({ enlace, evento:'contacto.nuevo', datos:{} });
  ok('un 400 no se reintenta', n === 1, 'se llamó ' + n);
  ok('y se explica de quién es el problema', /rechazó/i.test(cuatro.motivo));

  // 5xx: pasajero, se reintenta una vez
  let m = 0;
  globalThis.fetch = () => { m++; return Promise.resolve(new Response('boom',{status:503})); };
  await enviarEvento({ enlace, evento:'contacto.nuevo', datos:{} });
  ok('un 503 se reintenta una vez, no más', m === 2, 'se llamó ' + m);

  // el sistema del cliente caído NO tumba nada
  globalThis.fetch = () => Promise.reject(new Error('sin red'));
  const caido = await enviarEvento({ enlace, evento:'contacto.nuevo', datos:{} });
  ok('si el sistema del cliente está caído, no lanza', caido.ok === false);

  globalThis.fetch = real;
  ok('hay catálogo de eventos para el panel', catalogoDeEventos().length >= 5);
});


/* ══════════════════════════════════════════════════════════════════════
   21 · SUPERFICIE PÚBLICA — qué se puede descargar del sitio
   ══════════════════════════════════════════════════════════════════════ */
await suite('Superficie pública', async () => {
  // Lo que el navegador SÍ necesita. Todo lo demás no tiene por qué estar
  // publicado: no son secretos, pero son el trabajo del producto.
  const PERMITIDOS = ['perfil.mjs', 'catalogos-ui.mjs', 'cifrado.mjs', 'semillas.mjs'];
  const PROHIBIDOS = ['anclaje.mjs','cerebro.mjs','politicas.mjs','acciones.mjs',
                      'proveedores.mjs','diagnostico.mjs','datos.mjs','supabase.mjs',
                      'entorno.mjs','enlaces.mjs','seguridad.mjs','avisos.mjs'];

  // marcas.mjs es un caso aparte: NO se puede simplemente borrar. La red de
  // distribución ya había cacheado la versión vieja —que sí traía prompts— y
  // una copia cacheada no desaparece porque el archivo deje de existir en el
  // origen. Borrar deja el hueco; sobrescribir sí reemplaza la copia.
  // Por eso sigue ahí, vacío, y lo que se verifica es que esté vacío.
  const senuelo = await (await fetch('../publico/cerebro/marcas.mjs?v=' + Date.now())).text();
  ok('marcas.mjs es un señuelo, no el archivo real', senuelo.length < 2000, senuelo.length + ' bytes');
  ok('el señuelo no contiene prompts', !/NO diagnosticas|NO recetas|Eres el asistente/.test(senuelo));
  ok('el señuelo no exporta datos de marcas', /MARCAS = \{\}/.test(senuelo));

  for (const a of PERMITIDOS) {
    const r = await fetch('../publico/cerebro/' + a + '?v=' + Date.now());
    ok(`${a} está publicado, como debe`, r.ok);
  }
  for (const a of PROHIBIDOS) {
    const r = await fetch('../publico/cerebro/' + a + '?v=' + Date.now());
    ok(`${a} NO está en la carpeta pública`, !r.ok, 'sigue descargable');
  }

  // El prompt es el trabajo real: quien lo lea puede estudiar cómo saltarse
  // los límites. No debe aparecer en nada que baje al navegador.
  const publicos = await Promise.all(PERMITIDOS.map(a =>
    fetch('../publico/cerebro/' + a + '?v=' + Date.now()).then(r => r.text())));
  const todo = publicos.join('\n');
  ok('ningún archivo público contiene texto de prompt clínico',

  const publicable = await probarBase({ seleccionar: async () => [] });

   ══════════════════════════════════════════════════════════════════════ */
await suite('Prender y apagar el bot', async () => {
  const consultorio = { ...SEMILLAS.consultorio, captura: { activa: true } };
  const cafe = { ...SEMILLAS.cafe, captura: { activa: true } };

  // Encendido: no corta nada, le toca a la IA.
  ok('encendido deja pasar a la IA',
     decidirSinIA({ marca: cafe, modo: 'activo', ultimo: '¿cuánto cuesta?' }) === null);

  // Apagado y solo recados: contestan sin gastar en IA.
  const off = decidirSinIA({ marca: cafe, modo: 'apagado', ultimo: '¿cuánto cuesta?', hayContacto: true });
  ok('apagado no llama a la IA', off?.via === 'apagado');
  ok('apagado ofrece escribir directo si hay contacto', off.accion === 'derivar_humano');

  const off2 = decidirSinIA({ marca: cafe, modo: 'apagado', ultimo: 'hola', hayContacto: false });
  ok('apagado sin contacto no promete lo que no hay', off2.accion === 'ninguna');

  const rec = decidirSinIA({ marca: cafe, modo: 'recados', ultimo: '¿cuánto cuesta?' });
  ok('solo recados no llama a la IA', rec?.via === 'recados');
  ok('solo recados abre el formulario', rec.accion === 'capturar_contacto');
  ok('solo recados dice la verdad: contesta una persona', /persona/i.test(rec.texto));

                                    modo: 'recados', ultimo: 'hola', hayContacto: true });
  ok('sin formulario, recados deriva en vez de pedir datos', recSinForm.accion === 'derivar_humano');

  /* LO QUE NO SE APAGA.
     Este es el motivo de que la decisión viva en una función y no suelta en
     el manejador: escribir el corte por «apagado» antes del filtro clínico
     es lo natural, y deja a alguien con dolor de pecho sin el 911. */
  for (const modo of ['activo', 'recados', 'apagado']) {

    ok(`en modo "${modo}" la urgencia clínica gana`, r?.corte === 'urgencia', JSON.stringify(r));
    ok(`en modo "${modo}" la urgencia manda al 911`, /911/.test(r?.texto || ''));

  const enCafe = decidirSinIA({ marca: cafe, modo: 'apagado', ultimo: 'me duele el pecho', hayContacto: true });
  ok('un café apagado no inventa una urgencia clínica', enCafe.corte === 'apagado');

/* ══════════════════════════════════════════════════════════════════════
   ·  LA FIRMA DEL WEBHOOK DE META
   ══════════════════════════════════════════════════════════════════════ */
await suite('Firma del webhook', async () => {
  // Se reimplementa aquí lo mismo que hace el servidor, para comprobar que
  // el cálculo es el correcto contra un caso conocido.
  const hmac = async (secreto, texto) => {
    const enc = new TextEncoder();
    const k = await crypto.subtle.importKey('raw', enc.encode(secreto),
      { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
    const f = await crypto.subtle.sign('HMAC', k, enc.encode(texto));
    return [...new Uint8Array(f)].map(b=>b.toString(16).padStart(2,'0')).join('');
  };

  const cuerpo = '{"object":"whatsapp_business_account","entry":[{"id":"1"}]}';
  const firma = await hmac('secreto-de-la-app', cuerpo);

  ok('la firma es SHA-256 en hexadecimal', /^[0-9a-f]{64}$/.test(firma), firma);

  // El mismo cuerpo con el mismo secreto da siempre lo mismo.
  ok('es estable', await hmac('secreto-de-la-app', cuerpo) === firma);

  // Cambiar UN carácter del cuerpo cambia la firma entera.
  const alterado = cuerpo.replace('"1"', '"2"');
  ok('un cuerpo alterado NO coincide', await hmac('secreto-de-la-app', alterado) !== firma);

  // Otro secreto, otra firma. Es lo que impide que un tercero la fabrique.
  ok('otro secreto NO produce la misma firma', await hmac('otro-secreto', cuerpo) !== firma);

  /* EL DETALLE QUE ARRUINA ESTO EN PRODUCCIÓN: firmar el objeto vuelto a
     serializar en vez del texto que llegó. `JSON.stringify(JSON.parse(x))`
     casi nunca devuelve `x`, y entonces la firma no coincide NUNCA. */
  const conEspacios = '{"object": "whatsapp_business_account", "entry": [{"id": "1"}]}';
  ok('el mismo JSON con otro formato da otra firma — hay que usar el cuerpo crudo',
     await hmac('secreto-de-la-app', conEspacios) !== firma);
  ok('y reserializar lo cambia',
     JSON.stringify(JSON.parse(conEspacios)) !== conEspacios);

  // Comparación en tiempo constante: mismo resultado que ===, sin filtrar
  // por dónde dejó de coincidir.
  const igualConstante = (a, b) => {
    if (a.length !== b.length) return false;
    let d = 0; for (let i=0;i<a.length;i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  };
  ok('comparación constante: acepta la buena', igualConstante(firma, firma));
  ok('comparación constante: rechaza la mala', !igualConstante(firma, 'f'+firma.slice(1)));
  ok('comparación constante: rechaza distinto largo', !igualConstante(firma, firma.slice(0,-1)));
});


/* ══════════════════════════════════════════════════════════════════════
   ·  AGENDA  ·  lo que convierte al bot en agente
   ══════════════════════════════════════════════════════════════════════ */
await suite('Agenda', async () => {
  const horarios = {
    lunes:{abre:'16:00',cierra:'18:00'}, martes:{abre:'16:00',cierra:'18:00'},
    miercoles:{abre:'16:00',cierra:'18:00'}, jueves:{abre:'16:00',cierra:'18:00'},
    viernes:{abre:'16:00',cierra:'18:00'},
    sabado:{abre:'09:00',cierra:'11:00'}, domingo:{cerrado:true},
  };
  // Un lunes a las 8 de la mañana, para que el día completo esté por delante.
  const lunes = new Date(2026, 7, 24, 8, 0);

  const libres = huecosLibres({ horarios, desde: lunes, dias: 7 });
  ok('genera huecos', libres.length > 0, libres.length + ' huecos');
  ok('respeta la hora de apertura', libres[0].hora === '16:00', libres[0].hora);
  ok('no pasa de la hora de cierre', libres.every(h => h.hora < '18:00' || h.hora <= '10:30'));
  ok('salta el domingo', !libres.some(h => h.dia === '2026-08-30'), JSON.stringify(libres.filter(h=>h.dia==='2026-08-30')));
  ok('el sábado usa SU horario', libres.some(h => h.dia === '2026-08-29' && h.hora === '09:00'));

  // Lo ocupado no se ofrece. Es lo mínimo que se le pide a una agenda.
  const conOcupados = huecosLibres({ horarios, desde: lunes,
    ocupados: [{ dia:'2026-08-24', hora:'16:00' }, { dia:'2026-08-24', hora:'16:30' }] });
  ok('no ofrece lo ya apartado',
     !conOcupados.some(h => h.dia === '2026-08-24' && (h.hora === '16:00' || h.hora === '16:30')));
  ok('sí ofrece lo que sigue libre',
     conOcupados.some(h => h.dia === '2026-08-24' && h.hora === '17:00'));

  /* HOY NO SE OFRECE LO QUE YA PASÓ. Un bot que a las siete de la tarde te
     ofrece las cuatro no está agendando: está leyendo una tabla. */
  const tarde = new Date(2026, 7, 24, 17, 15);
  const desdeTarde = huecosLibres({ horarios, desde: tarde, dias: 1 });
  ok('no ofrece horas que ya pasaron',
     !desdeTarde.some(h => h.dia === '2026-08-24' && h.hora <= '17:15'), JSON.stringify(desdeTarde));

  // Ni la hora en curso: nadie llega en cero minutos.
  const casi = new Date(2026, 7, 24, 16, 50);
  ok('deja colchón para llegar',
     !huecosLibres({ horarios, desde: casi, dias: 1 }).some(h => h.hora === '17:00'));

  // Negocio sin horarios cargados: no inventa disponibilidad.
  ok('sin horarios no ofrece nada', huecosLibres({ horarios: {}, desde: lunes }).length === 0);
  ok('un horario al revés se ignora',
     huecosLibres({ horarios: { lunes:{abre:'18:00',cierra:'16:00'} }, desde: lunes }).length === 0);

  /* TRES opciones, y de días distintos cuando se puede: ofrecer tres huecos
     seguidos del mismo jueves es ofrecer un día disfrazado de tres. */
  const tres = tresOpciones(libres);
  ok('ofrece exactamente tres', tres.length === 3);
  ok('reparte entre días distintos', new Set(tres.map(t => t.dia)).size === 3,
     JSON.stringify(tres.map(t=>t.dia)));

  const unSoloDia = huecosLibres({ horarios: { lunes: horarios.lunes }, desde: lunes, dias: 1 });
  ok('con un solo día abierto, completa con ese día', tresOpciones(unSoloDia).length === 3);

  // Entender qué eligió la persona
  ok('entiende el texto del botón', cualEligio(tres[0].comoSeDice, tres) === tres[0]);
  ok('entiende solo la hora si es única',
     cualEligio('me sirve a las ' + tres[0].hora, [tres[0]]) === tres[0]);
  ok('no adivina si es ambiguo', cualEligio('mañana', tres) === null);
  ok('no adivina con texto vacío', cualEligio('', tres) === null);

  /* LO QUE NO SE OFRECIÓ, NO SE APARTA. Si alguien pide una hora que no
     estaba entre las opciones, quizá se la ganaron mientras escribía. */
  ok('no aparta algo que no se ofreció', cualEligio('el jueves a las 23:00', tres) === null);
});

await suite('Identificador de sesión · la llave de la conversación', async () => {
  // widget.js es un script clásico: no se puede importar. Se trae como
  // texto y se ejecuta el generador aquí. Es la única forma de PROBAR lo
  // que hace en vez de creerle al comentario que tiene arriba.
  let fuente = '';
  try { fuente = await (await fetchReal.call(window, '../publico/widget.js', { cache: 'no-store' })).text(); }
  catch (e) { fuente = ''; }

  ok('se pudo leer widget.js', fuente.length > 1000, 'largo: ' + fuente.length);

  const trozo = (fuente.match(/function nuevaSesion\(\)\s*\{[\s\S]*?\n  \}/) || [])[0];
  ok('existe nuevaSesion()', !!trozo, 'no la encontré en el archivo');

  let generar = null;
  if (trozo) generar = new Function(trozo + '; return nuevaSesion;')();

  if (!generar) { ok('se pudo ejecutar el generador', false, 'no se armó'); return; }

  const muestras = [];
  for (let i = 0; i < 2000; i++) muestras.push(generar());

  ok('nunca repite en 2000 intentos',
     new Set(muestras).size === 2000,
     'distintos: ' + new Set(muestras).size);

  ok('siempre mide lo mismo (32 hex)',
     muestras.every(m => /^[0-9a-f]{32}$/.test(m)),
     muestras.find(m => !/^[0-9a-f]{32}$/.test(m)));

  // Lo que hacía frágil al anterior: la hora iba pegada al final, y la hora
  // no es un secreto. Si el reloj aparece en el id, se adivina medio id.
  const ahora = Date.now();
  const relojes = [ahora.toString(36), ahora.toString(16), String(ahora),
                   Math.floor(ahora / 1000).toString(16)];
  ok('no lleva el reloj pegado',
     !muestras.some(m => relojes.some(r => m.includes(r.slice(0, 6)))),
     'una muestra contenía la hora');

  // Un generador roto que devolviera siempre lo mismo pasaría las pruebas
  // de formato. Esto mide que los 128 bits se muevan de verdad: cada
  // posición del texto debe tomar varios valores distintos.
  const posiciones = [];
  for (let i = 0; i < 32; i++) posiciones.push(new Set(muestras.map(m => m[i])).size);
  ok('los 32 lugares varían (≥12 valores cada uno)',
     Math.min(...posiciones) >= 12,
     'el lugar más pobre tuvo ' + Math.min(...posiciones));

  // Guardia contra regresión: que nadie vuelva a meter Math.random donde
  // se decide quién puede leer una conversación.
  // Se miran las INSTRUCCIONES, no la prosa: el comentario de nuevaSesion
  // nombra a Math.random justamente para explicar por qué no se usa, y una
  // guardia que no sepa distinguir prosa de código grita en falso.
  const sinComentarios = t => t.replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/\/\/[^\n]*/g, ' ');
  const zonaSesion = sinComentarios(fuente.slice(0, fuente.indexOf('/* ── utilidades')));
  ok('Math.random ya no decide quién lee una conversación',
     !/Math\.random/.test(zonaSesion),
     'volvió a aparecer en la zona de sesión');

  // Y que la guardia sirva de algo: si no detectara el código viejo, sería
  // un adorno verde que no protege nada.
  ok('la guardia sí atrapa el código viejo',
     /Math\.random/.test(sinComentarios('var v = Math.random().toString(36); // nota')),
     'la guardia no detecta ni el caso que vino a evitar');
});

await suite('La llave de servicio · toda consulta acota por empresa', async () => {
  // datos.mjs es el único archivo que se salta RLS. Ahí el aislamiento no lo
  // cuida la base: lo cuida el archivo. Esta prueba lee su código y comprueba
  // que ninguna consulta a una tabla de inquilino se quedó sin `empresa_id`.
  //
  // No prueba comportamiento, prueba una REGLA — y por eso vale: la ronda que
  // agregue la función diecisiete se entera aquí, no en producción.
  let fuente = '';
  try { fuente = await (await fetchReal.call(window, '../servidor/nucleo/datos.mjs', { cache: 'no-store' })).text(); }
  catch (e) { fuente = ''; }
  ok('se pudo leer datos.mjs', fuente.length > 1000, 'largo: ' + fuente.length);
  if (!fuente) return;

  const codigo = fuente.replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/\/\/[^\n]*/g, ' ');
  const DE_INQUILINO = ['conversaciones', 'leads', 'citas', 'avisos'];

  // Cada llamada, desde el nombre de la tabla hasta su paréntesis de cierre.
  function llamadas(texto) {
    const salida = [];
    const re = /sb\.(seleccionar|actualizar|insertar)\(\s*'([a-z_]+)'/g;
    let m;
    while ((m = re.exec(texto))) {
      let i = re.lastIndex, hondo = 1;
      while (i < texto.length && hondo > 0) {
        if (texto[i] === '(') hondo++;
        else if (texto[i] === ')') hondo--;
        i++;
      }
      salida.push({ que: m[1], tabla: m[2], cuerpo: texto.slice(m.index, i) });
    }
    return salida;
  }

  const todas = llamadas(codigo);
  ok('encontró las consultas del archivo', todas.length >= 10, 'halló ' + todas.length);

  // Se juzga por FUNCIÓN, no por paréntesis. `citasDe` y `moverCita` arman
  // su filtro en una variable la línea de arriba: acotan de verdad, y un
  // detector que las marcara estaría gritando en falso. Un candado que grita
  // en falso se acaba ignorando, y entonces ya no es un candado.
  const funciones = [];
  const reFn = /export (?:async )?function (\w+)/g;
  let m;
  while ((m = reFn.exec(codigo))) {
    const sigue = reFn.lastIndex;
    reFn.lastIndex = sigue;
    const otra = /export (?:async )?function \w+/g;
    otra.lastIndex = sigue;
    const fin = otra.exec(codigo)?.index ?? codigo.length;
    funciones.push({ nombre: m[1], cuerpo: codigo.slice(m.index, fin) });
  }
  ok('reconoció las funciones del archivo', funciones.length >= 12, 'halló ' + funciones.length);

  const sueltas = [];
  for (const f of funciones) {
    for (const c of llamadas(f.cuerpo)) {
      if (!DE_INQUILINO.includes(c.tabla)) continue;
      // Leer o escribir se acota con un filtro; insertar, con la columna.
      const acota = c.que === 'insertar'
        ? /empresa_id\s*:/.test(c.cuerpo)
        : /empresa_id=eq\./.test(f.cuerpo);
      if (!acota) sueltas.push(f.nombre + ' → ' + c.que + " '" + c.tabla + "'");
    }
  }

  ok('ninguna función se salta el filtro por empresa',
     sueltas.length === 0, sueltas.join(' · '));

  // Que el candado sirva de algo: se le pone enfrente una función que
  // consulta sin acotar y tiene que marcarla.
  const trampa = `export async function fuga({ id }) {
    const g = await sb.actualizar('citas', \`id=eq.\${id}\`, { estado: 'x' });
    return g;
  }`;
  const codigoTrampa = trampa.replace(/\/\/[^\n]*/g, ' ');
  const marcada = llamadas(codigoTrampa)
    .some(c => DE_INQUILINO.includes(c.tabla) && !/empresa_id=eq\./.test(codigoTrampa));
  ok('el candado sí marca una función sin acotar', marcada,
     'dejó pasar una consulta a citas sin empresa_id');
});

suite('El tope del día · que el plan signifique algo', () => {

  ok('cada plan trae lo suyo',
     topeDe({ plan: 'prueba' }) === TOPES.prueba &&
     topeDe({ plan: 'basico' }) === TOPES.basico &&
     topeDe({ plan: 'pro' })    === TOPES.pro);

  ok('un plan desconocido cae en el más chico, no en el más grande',
     topeDe({ plan: 'inventado' }) === TOPES.prueba,
     String(topeDe({ plan: 'inventado' })));

  ok('sin plan tampoco regala el tope grande',
     topeDe({}) === TOPES.prueba && topeDe() === TOPES.prueba);

  ok('el tope propio le gana al del plan',
     topeDe({ plan: 'prueba', topeDiario: 5000 }) === 5000);

  // Un cero o una basura en esa columna NO deben dejar mudo a un negocio.
  ok('un tope propio inválido se ignora en vez de callar al bot',
     topeDe({ plan: 'basico', topeDiario: 0 })     === TOPES.basico &&
     topeDe({ plan: 'basico', topeDiario: -3 })    === TOPES.basico &&
     topeDe({ plan: 'basico', topeDiario: 'ocho' }) === TOPES.basico);

  // ── dónde va el día ──
  const e = (u, t = 100) => estadoDeCuota({ usados: u, tope: t });

  ok('en el tope exacto TODAVÍA contesta',
     e(100).excedido === false, 'usados=tope debería pasar');

  ok('uno más y ya no',
     e(101).excedido === true);

  ok('cuenta lo que queda', e(30).restantes === 70 && e(140).restantes === 0);

  // Lo importante del aviso no es que se mande: es que se mande UNA vez.
  // Un aviso por mensaje a partir del 80% acaba en la basura, y entonces el
  // dueño no se entera del que sí importaba.
  const veces = (desde, hasta, cual) => {
    let n = 0;
    for (let i = desde; i <= hasta; i++) if (e(i)[cual]) n++;
    return n;
  };
  ok('el aviso del 80% suena exactamente una vez',
     veces(0, 200, 'avisarCerca') === 1, 'sonó ' + veces(0, 200, 'avisarCerca') + ' veces');
  ok('el aviso del tope suena exactamente una vez',
     veces(0, 200, 'avisarTope') === 1, 'sonó ' + veces(0, 200, 'avisarTope') + ' veces');
  ok('el del 80% suena en el 80', e(80).avisarCerca === true);
  ok('el del tope suena al pasarse, no al llegar',
     e(100).avisarTope === false && e(101).avisarTope === true);

  // ── qué se le dice a quien escribió ──
  const conCaptura = respuestaPorTope({ marca: { captura: { activa: true } } });
  const sinCaptura = respuestaPorTope({ marca: {} });

  ok('si puede tomar datos, los pide', conCaptura.accion === 'capturar_contacto');
  ok('si no puede, no inventa una acción', sinCaptura.accion === 'ninguna');

  // NO se reusa el texto de «recados». Ese promete que una persona va a
  // contestar ahorita, y aquí puede que no haya nadie mirando: sería una
  // promesa que el negocio nunca pidió hacer.
  const prometeHumano = t => /te contesta una persona|ahorita te contesta/i.test(t);
  ok('no le promete a nadie que un humano va a contestar',
     !prometeHumano(conCaptura.texto) && !prometeHumano(sinCaptura.texto),
     conCaptura.texto);

  ok('dice la verdad: que es por hoy',
     /hoy/i.test(conCaptura.texto) && /hoy/i.test(sinCaptura.texto));
});

suite('El orden de los cortes · la urgencia por encima del dinero', () => {
  const clinica = {
    nombre: 'Consultorio', politicas: ['urgencias-clinicas'],
    captura: { activa: true }, contactos: {},
  };

  // Lo único no negociable de todo esto: quedarse sin cuota es un asunto de
  // dinero, y un asunto de dinero no puede dejar a alguien sin que le digan
  // que llame al 911.
  const conDolor = decidirSinIA({ marca: clinica, modo: 'activo',
                                  ultimo: 'me duele mucho el pecho y no puedo respirar',
                                  sobreTope: true });
  ok('con el tope pasado, una urgencia SIGUE saliendo',
     conDolor?.corte === 'urgencia', conDolor?.corte);

  ok('y sale la instrucción de verdad, no un texto de tope',
     /911|urgencias|inmediat/i.test(conDolor?.texto || ''), conDolor?.texto);

  // El interruptor del dueño es una decisión suya; el tope es una
  // consecuencia. Manda la decisión.
  const apagado = decidirSinIA({ marca: clinica, modo: 'apagado',
                                 ultimo: 'hola', sobreTope: true });
  ok('el apagado del dueño le gana al tope', apagado?.corte === 'apagado', apagado?.corte);

  const recados = decidirSinIA({ marca: clinica, modo: 'recados',
                                 ultimo: 'hola', sobreTope: true });
  ok('el modo recados también le gana al tope', recados?.corte === 'recados', recados?.corte);

  // Y con todo en orden, el tope sí corta.
  const tope = decidirSinIA({ marca: clinica, modo: 'activo',
                              ultimo: '¿cuánto cuesta la consulta?', sobreTope: true });
  ok('con el bot activo y sin urgencia, el tope corta', tope?.corte === 'tope', tope?.corte);

  ok('sin tope pasado, se le pregunta a la IA como siempre',
     decidirSinIA({ marca: clinica, modo: 'activo',
                    ultimo: '¿cuánto cuesta la consulta?', sobreTope: false }) === null);
});

await suite('La lista blanca · que no se caiga nada por el hueco', async () => {
  /* `normalizarPerfil` deja pasar solo lo que nombra. Lo que no, se pierde
     SIN ERROR — y ese silencio ya costó caro: `modo` nunca llegó, así que el
     interruptor de apagado no apagaba nada, y `destinos` tampoco, así que el
     aviso de urgencia no habría llegado aunque el correo estuviera puesto.

     Las pruebas de antes no lo veían porque le pasaban el modo a mano a
     `decidirSinIA`. Probaban la decisión; nunca que el dato LLEGARA a la
     decisión. Esta prueba cubre justo ese tramo. */

  // 1 · Comparar código contra código: lo que la base manda vs. lo que pasa.
  // `no-store` no es adorno: leer del caché haría que esta prueba juzgara
  // una version vieja del archivo y diera un aprobado falso justo cuando
  // alguien acaba de romper algo. Un candado que lee ayer no cierra hoy.
  const traer = async ruta =>
    (await fetchReal.call(window, ruta, { cache: 'no-store' })).text();

  let datos = '', perfil = '';
  try {
    datos  = await traer('../servidor/nucleo/datos.mjs');
    perfil = await traer('../publico/cerebro/perfil.mjs');
  } catch (e) { /* abajo se marca */ }

  ok('se pudieron leer los dos archivos', datos.length > 1000 && perfil.length > 1000);

  if (datos && perfil) {
    /* Cuenta las dos formas de devolver una clave: `clave: valor` y la
       abreviada `clave,`. Un detector que solo viera la primera marcaría
       como perdida una clave que sí pasa — y eso ya pasó: dio a `identidad`
       por caída, se le creyó, y el «arreglo» duplicó la clave y pisó al
       bueno. La prueba de abajo lo comprueba en vez de suponerlo. */
    const claves = txt => new Set([
      ...[...txt.matchAll(/^\s{4}([A-Za-z_]\w*)\s*:/gm)].map(m => m[1]),
      ...[...txt.matchAll(/^\s{4}([A-Za-z_]\w*)\s*,\s*$/gm)].map(m => m[1]),
    ]);

    ok('el detector entiende la forma abreviada',
       claves('    uno: 1,\n    dos,\n').has('dos'),
       'no vio `dos,` — daría falsos positivos');

    const iM = datos.indexOf('return normalizarPerfil({');
    const manda = claves(datos.slice(iM, datos.indexOf('\n}', iM)));

    const iP = perfil.indexOf('export function normalizarPerfil');
    const deja = claves(perfil.slice(iP, perfil.indexOf('\n}', perfil.indexOf('ejemplo:', iP))));

    const caidos = [...manda].filter(k => !deja.has(k));
    ok('nada de lo que manda la base se cae en la normalización',
       caidos.length === 0, 'se pierden: ' + caidos.join(', '));

    ok('el comparador encontró algo que comparar',
       manda.size >= 15 && deja.size >= 20, manda.size + ' vs ' + deja.size);
  }

  // 2 · Y comportamiento, no solo forma: los campos de los que depende una
  //     operación tienen que sobrevivir de verdad.
  const crudo = {
    id: 'abc', slug: 'x', nombre: 'X',
    modo: 'apagado',
    topeDiario: 750,
    identidad: { color: '#123456' },
    destinos: { correo: 'a@b.c' },
    enlace: { url: 'https://x.test', secreto: 's' },
  };
  const n = normalizarPerfil(crudo);

  ok('el INTERRUPTOR sobrevive', n.modo === 'apagado', String(n.modo));
  ok('el tope propio sobrevive', n.topeDiario === 750, String(n.topeDiario));
  ok('a dónde avisar sobrevive', n.destinos?.correo === 'a@b.c', JSON.stringify(n.destinos));
  ok('el enlace saliente sobrevive', n.enlace?.url === 'https://x.test', JSON.stringify(n.enlace));
  ok('los colores de la marca sobreviven', n.identidad?.color === '#123456', JSON.stringify(n.identidad));

  // 3 · Un modo inventado no debe abrir el bot: se cae al lado seguro.
  ok('un modo inventado cae en activo, no en nada',
     normalizarPerfil({ ...crudo, modo: 'chistoso' }).modo === 'activo');

  // 4 · Y lo que el navegador recibe NO puede traer los secretos.
  const publico = perfilPublico(crudo);
  ok('el navegador NO recibe a dónde se avisa', publico.destinos === undefined);
  ok('el navegador NO recibe el secreto del enlace', publico.enlace === undefined);
  ok('el navegador NO recibe el interruptor', publico.modo === undefined);
  ok('pero SÍ recibe los colores', publico.marca?.color === '#123456');
});

await suite('El camino de ESCRITURA · que lo escrito llegue a la base', async () => {
  /* Ayer se auditó el camino de LECTURA —de la base al bot— y se encontraron
     cuatro campos que se caían, incluido el interruptor de apagado. Esta
     prueba hace lo mismo en la otra dirección: del formulario a la base.

     Ahí también había cuatro que no llegaban. Dos eran fantasmas (nadie los
     leía), pero `proveedores` SÍ se lee en proveedores.mjs desde siempre: la
     función existía y era inalcanzable, porque su valor nunca se guardaba.

     Se compara código contra código. Es feo y es lo que funciona: el hueco
     no da error, solo silencio, y el silencio no se prueba con un assert
     sobre un valor. */
  const traer = async r => (await fetchReal.call(window, r, { cache: 'no-store' })).text();
  let perfil = '', idx = '', adm = '';
  try {
    perfil = await traer('../publico/cerebro/perfil.mjs');
    idx    = await traer('../publico/index.html');
    adm    = await traer('../servidor/admin.mjs');
  } catch (e) { /* se marca abajo */ }

  ok('se pudieron leer los tres archivos',
     perfil.length > 1000 && idx.length > 1000 && adm.length > 1000);

  if (perfil && idx && adm) {
    const claves = (t, ind) => new Set([
      ...[...t.matchAll(new RegExp('^\\s{' + ind + '}([A-Za-z_]\\w*)\\s*:', 'gm'))].map(m => m[1]),
      ...[...t.matchAll(new RegExp('^\\s{' + ind + '}([A-Za-z_]\\w*)\\s*,\\s*$', 'gm'))].map(m => m[1]),
    ]);

    // Lo que el formulario produce.
    const iP = perfil.indexOf('export function normalizarPerfil');
    const produce = claves(perfil.slice(iP, perfil.indexOf('\n}', perfil.indexOf('ejemplo:', iP))), 4);

    // Lo que el servidor guarda en columnas sueltas, y de qué campo lo saca.
    const iG = adm.indexOf("case 'empresas.guardar'");
    const guardar = adm.slice(iG, adm.indexOf("case 'empresas.modo'"));
    const deColumna = new Set([...guardar.matchAll(/datos\.(\w+)/g)].map(m => m[1]));

    // Lo que viaja cifrado en el bulto.
    const iS = idx.indexOf('function secretosDe(p)');
    const enBulto = new Set([...idx.slice(iS, idx.indexOf('\n}', iS)).matchAll(/p\.(\w+)/g)].map(m => m[1]));

    /* Los que se ponen a propósito por otra vía, no por `empresas.guardar`:
       el identificador y el slug los pone el alta; estado, modo y ejemplo
       tienen su propio endpoint porque son decisiones, no datos; identidad
       viaja como `marca`. Esta lista es corta a propósito — si crece, es que
       algo se está escondiendo detrás de la palabra «aparte». */
    const porOtraVia = new Set(['id', 'slug', 'estado', 'ejemplo', 'modo', 'identidad', 'destinos', 'enlace']);

    /* La base escribe en minúsculas con guión bajo (`tope_diario`) y el
       formulario en jorobas (`topeDiario`). Comparar los nombres tal cual
       daba por perdido un campo que sí se guarda — el mismo tipo de falso
       positivo que ayer costó romper los colores por creerle a un detector
       sin calibrar. Se comparan aplanados. */
    const plano = t => t.toLowerCase().replace(/_/g, '');
    const llegan = new Set([...deColumna, ...enBulto, ...porOtraVia].map(plano));

    /* Deuda A LA VISTA, no barrida bajo la alfombra. `escalamiento` describe
       una función que no existe —pasar a un humano tras N fallos— y por eso
       no llega a la base: no hay nada que guardar todavía. Va en su propia
       lista y no en la de «por otra vía» a propósito: esa diría que está
       resuelto, y esta dice lo que es. Cuando se construya, sale de aquí. */
    const especificadoSinConstruir = new Set(['escalamiento']);

    const huerfanos = [...produce].filter(k =>
      !llegan.has(plano(k)) && !especificadoSinConstruir.has(k));

    ok('la deuda declarada sigue siendo UNA sola cosa',
       especificadoSinConstruir.size === 1,
       'ya son ' + especificadoSinConstruir.size + ': se está usando de alfombra');

    ok('nada de lo que el formulario recoge se pierde al guardar',
       huerfanos.length === 0, 'no llegan a la base: ' + huerfanos.join(', '));

    ok('el comparador vio los tres conjuntos',
       produce.size >= 25 && deColumna.size >= 8 && enBulto.size >= 8,
       [produce.size, deColumna.size, enBulto.size].join(' / '));

    // `proveedores` es el que dolía: se leía y nunca se podía escribir.
    ok('proveedores ya tiene por dónde guardarse', enBulto.has('proveedores'));
    ok('la zona horaria ya tiene por dónde guardarse', enBulto.has('zonaHoraria'));

    // Y que la lista de excepciones no se use para tapar agujeros nuevos.
    ok('la lista de «va por otra vía» sigue siendo corta',
       porOtraVia.size <= 8, 'ya son ' + porOtraVia.size);

    // Que el comparador aplanado no se pase de listo y dé todo por bueno.
    ok('el comparador aplanado sigue detectando lo que de verdad falta',
       !llegan.has(plano('unCampoQueNadieGuarda')),
       'aprueba cualquier cosa: no sirve de candado');
  }
});
